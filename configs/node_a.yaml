# LiquidLink Node A Configuration

node:
  id: "node-a"
  address: ""
  port: 8080
  log_level: "info"

storage:
  path: "./data/node-a/badger"
  value_log_file_size: 10485760 # 10MB for local ledger storage

consensus:
  leader_rotation_interval: "30s"
  vote_timeout: "5s"
  majority_threshold: 0.51

transports:
  internet:
    enabled: true
    bind_address: "0.0.0.0:9090"
    bootstrap_peers:
      - "127.0.0.1:9091"
  bluetooth:
    enabled: false
    device_id: "hci0"
    service_uuid: "00001101-0000-1000-8000-00805F9B34FB"

pcn:
  channel_reserve: 0.05 # 5% channel reserve
  routing_fee_flat: 10 # 10 micro-tokens
  routing_fee_percent: 0.001 # 0.1%
